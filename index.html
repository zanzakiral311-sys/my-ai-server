<!DOCTYPE html>
<html lang="bn" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI</title>
<style>
:root{--bg:#fff;--fg:#111;--ai:#f0f0f3;--bd:#8884;--fs:16px}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--ai:#262626}
@media(prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#111;--fg:#eee;--ai:#262626}}
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--fg);font-size:var(--fs);display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font-family:inherit;color:inherit}
header{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
header .t{flex:1;font-weight:600;text-align:center}
.ib{background:none;border:none;font-size:22px;padding:4px 8px}
.pill{background:#e5defd;color:#4527a0;border:none;border-radius:14px;padding:5px 10px;font-size:13px;font-weight:600}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:10px 12px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#2f5fd0;color:#fff}
.ai{align-self:flex-start;background:var(--ai)}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.acts{display:flex;gap:18px;margin-top:8px;font-size:13px;opacity:.8;flex-wrap:wrap}
.acts span{cursor:pointer}
#chip{display:none;padding:6px 12px;font-size:13px;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);background:var(--ai)}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd);align-items:center}
form input{flex:1;min-width:0;padding:12px;border-radius:20px;border:1px solid #8886;font-size:16px;background:var(--ai);color:var(--fg)}
.rb{border:none;border-radius:50%;width:42px;height:42px;font-size:20px;background:#777;color:#fff;flex-shrink:0}
.rb.go{background:#2f5fd0}
.rb.on{background:#7a5af8}
#amenu{display:none;position:fixed;inset-inline-start:10px;bottom:70px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;z-index:5;overflow:hidden;min-width:200px}
#amenu.open{display:block}
#amenu button{display:block;width:100%;text-align:left;padding:13px 18px;background:none;border:none;border-bottom:1px solid var(--bd);font-size:15px}
.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);color:var(--fg);z-index:10;overflow-y:auto}
.ov.open{display:block}
#drawer{right:auto;width:82%;border-right:1px solid var(--bd)}
#wel{z-index:20}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);gap:12px}
.sec{padding:14px 16px 6px;font-size:13px;opacity:.65}
select{font-size:15px;padding:6px;background:var(--ai);color:var(--fg);border:1px solid #8886;border-radius:8px;max-width:55%}
.btn{background:none;border:1px solid #8886;border-radius:8px;padding:6px 12px;font-size:14px}
.danger{color:#d33}
.ci{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;border-bottom:1px solid var(--bd);gap:8px}
.ci span{flex:1;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 0}
.plan{border:2px solid #7a5af8;border-radius:12px;padding:14px;margin:8px 16px}
.go2{display:block;margin:16px;padding:14px;border:none;border-radius:10px;background:#7a5af8;color:#fff;font-size:16px;width:calc(100% - 32px)}
.feat{padding:6px 24px;line-height:2}
.note{padding:0 16px 24px;font-size:12px;opacity:.65;line-height:1.6}
.wbox{max-width:420px;margin:0 auto;padding:40px 20px}
.wbox h1{text-align:center;font-size:26px;margin:0 0 8px}
.wbox p{text-align:center;opacity:.75;margin:0 0 28px}
.wbox label{display:block;margin:16px 0 6px;font-size:14px;opacity:.8}
.wbox select{width:100%;max-width:100%;padding:12px;font-size:16px}
</style>
</head>
<body>
<header>
<button class="ib" id="menu">☰</button>
<span class="t" data-i18n="title"></span>
<button class="pill" id="prem" data-i18n="prem"></button>
<button class="ib" id="gear">⚙</button>
</header>
<div id="chat"></div>
<div id="chip"></div>
<form id="f">
<button type="button" class="rb" id="plus">＋</button>
<input type="text" id="box" autocomplete="off">
<button type="button" class="rb" id="mic">🎤</button>
<button type="submit" class="rb go">➤</button>
</form>
<div id="amenu">
<button type="button" id="mCam" data-i18n="mCam"></button>
<button type="button" id="mGal" data-i18n="mGal"></button>
<button type="button" id="mDoc" data-i18n="mDoc"></button>
<button type="button" id="mDraw" data-i18n="mDraw"></button>
</div>
<input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fGal" accept="image/*" style="display:none">
<input type="file" id="fDoc" accept=".pdf,.txt,.md,.csv,application/pdf,text/plain" style="display:none">

<div class="ov" id="drawer">
<div class="row"><b data-i18n="dTitle"></b><button class="btn" id="dclose" data-i18n="close"></button></div>
<div class="row"><button class="btn" id="dnew" data-i18n="newc"></button></div>
<div id="dlist"></div>
</div>

<div class="ov" id="set">
<div class="row"><b data-i18n="settings"></b><button class="btn" id="sclose" data-i18n="close"></button></div>
<div class="row"><div><b data-i18n="guest"></b><br><small data-i18n="loginNot"></small></div></div>
<div class="sec" data-i18n="secLang"></div>
<div class="row"><span data-i18n="appLang"></span><select id="alang"></select></div>
<div class="row"><span data-i18n="country"></span><select id="ccountry"></select></div>
<div class="row"><span data-i18n="sl"></span><select id="sl"></select></div>
<div class="row"><span data-i18n="voice"></span><select id="voice"></select></div>
<div class="row"><span data-i18n="rate"></span><select id="rate"><option value="0.8" data-i18n="r1"></option><option value="1" data-i18n="r2"></option><option value="1.3" data-i18n="r3"></option></select></div>
<div class="row"><span data-i18n="auto"></span><input type="checkbox" id="auto"></div>
<div class="sec" data-i18n="secAi"></div>
<div class="row"><span data-i18n="search"></span><input type="checkbox" id="search"></div>
<div class="row"><span data-i18n="imgq"></span><select id="quality"><option value="normal" data-i18n="q1"></option><option value="high" data-i18n="q2"></option></select></div>
<div class="row"><span data-i18n="style"></span><select id="style"><option value="short" data-i18n="s1"></option><option value="long" data-i18n="s2"></option></select></div>
<div class="sec" data-i18n="secLook"></div>
<div class="row"><span data-i18n="theme"></span><select id="theme"><option value="auto" data-i18n="th1"></option><option value="light" data-i18n="th2"></option><option value="dark" data-i18n="th3"></option></select></div>
<div class="row"><span data-i18n="fs"></span><select id="fs"><option value="14px" data-i18n="f1"></option><option value="16px" data-i18n="f2"></option><option value="19px" data-i18n="f3"></option></select></div>
<div class="sec" data-i18n="secData"></div>
<div class="row"><span data-i18n="exp"></span><button class="btn" id="exp" data-i18n="expBtn"></button></div>
<div class="row"><span class="danger" data-i18n="clr"></span><button class="btn danger" id="clr" data-i18n="clrBtn"></button></div>
<div class="row"><span data-i18n="priv"></span><button class="btn" id="priv" data-i18n="view"></button></div>
<div class="sec" data-i18n="secAcc"></div>
<div class="row"><span class="danger" data-i18n="logout"></span><button class="btn danger" id="logout" data-i18n="logout"></button></div>
<div class="row"><span class="danger" data-i18n="delacc"></span><button class="btn danger" id="delacc" data-i18n="clrBtn"></button></div>
</div>

<div class="ov" id="pm">
<div class="row"><b data-i18n="pTitle"></b><button class="btn" id="pclose" data-i18n="close"></button></div>
<div style="text-align:center;font-size:40px;padding:16px 0 4px">👑</div>
<div style="text-align:center;font-weight:600" data-i18n="pSub"></div>
<div class="feat"><div data-i18n="pf1"></div><div data-i18n="pf2"></div><div data-i18n="pf3"></div><div data-i18n="pf4"></div></div>
<div class="plan" data-i18n="plan1"></div>
<div class="plan" data-i18n="plan2"></div>
<button class="go2" id="buy" data-i18n="buy"></button>
<div class="note" data-i18n="pNote"></div>
</div>

<div class="ov" id="wel">
<div class="wbox">
<h1 data-i18n="wTitle"></h1>
<p data-i18n="wSub"></p>
<label data-i18n="wl"></label>
<select id="welL"></select>
<label data-i18n="wc"></label>
<select id="welC"></select>
<button class="go2" id="welGo" style="width:100%;margin:28px 0 0" data-i18n="go"></button>
</div>
</div>

let trBusy=false;
async function ensureLang(){
  const L=S.lang;
  if(T[L]||TR[L]||trBusy)return;
  trBusy=true;
  box.placeholder="⏳ ...";
  const srcS={};Object.keys(T.en).forEach(k=>{if(k!=="wTitle")srcS[k]=T.en[k]});
  try{
    const r=await fetch("/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:L,strings:srcS})});
    if(!r.ok)throw new Error("x");
    const j=await r.json();
    if(j&&j.map){TR[L]=j.map;try{localStorage.setItem("tr",JSON.stringify(TR))}catch(e){}}
  }catch(e){if(!warned[L]){warned[L]=1;alert(T.en.trFail)}}

function copyText(x){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x);return true}}catch(e){}
  try{const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();const ok=document.execCommand("copy");document.body.removeChild(a);return ok}catch(e){return false}
}
function speak(x){
  if(!window.speechSynthesis){alert(t("noSpeech"));return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(x);
  u.lang=S.sl;u.rate=parseFloat(S.rate);
  if(S.voice){const v=speechSynthesis.getVoices().find(v=>v.name===S.voice);if(v)u.voice=v}
  u.onerror=()=>alert(t("noVoice"));
  speechSynthesis.speak(u);
}

function addMsg(m,last,pending){
  const d=mk("div","msg "+(m.role==="user"?"user":"ai"));
  if(m.img){const i=mk("img");i.src=m.img;d.appendChild(i)}
  d.appendChild(mk("div","",m.content+(m.note?"\n📎 "+m.note:"")));
  if(m.role!=="user"&&!pending){
    const a=mk("div","acts");
    const mkA=(txt,fn)=>{const s=mk("span","",txt);s.onclick=()=>fn(s);a.appendChild(s)};
    if(m.img){
      mkA(t("save"),()=>window.open(m.img,"_blank"));
      mkA(t("share"),s=>share(m.img,s));
    }else{
      mkA(t("listen"),()=>speak(m.content));
      mkA(t("copy"),s=>{s.textContent=copyText(m.content)?t("copied"):t("copyFail")});
      mkA(t("share"),s=>share(m.content,s));
    }
    if(last)mkA(t("regen"),()=>regen());
    d.appendChild(a);
  }
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

async function reply(c,q,asImg,a){
  addMsg({role:"assistant",content:t("thinking")},false,true);
  let m;
  try{
    if(asImg){
      const r=await fetch("/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:q,quality:S.quality})});
      if(!r.ok){m={role:"assistant",content:t("noImg")}}
      else{const j=await r.json();m={role:"assistant",content:j.reply||"OK",img:j.url||""}}
    }else{
      const msgs=c.msgs.slice(-20).map(x=>({role:x.role,content:x.content}));
      const body={messages:msgs,search:S.search,style:S.style};
      if(a)body.attachment={type:a.type,media_type:a.media_type,data:a.data,text:a.text,name:a.name};
      const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json();
      m={role:"assistant",content:j.reply||t("noReply")};
    }
  }catch(e){m={role:"assistant",content:t("errConn")}}
  c.msgs.push(m);persist();render();
  if(S.auto&&!m.img)speak(m.content);
}

function readFile(f){
  if(!f)return;
  if(f.size>8*1024*1024){alert(t("tooBig"));return}
  const rd=new FileReader();
  if(f.type.indexOf("image/")===0){
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,1280/Math.max(im.width,im.height));
        const w=Math.round(im.width*k),h=Math.round(im.height*k);
        const cv=document.createElement("canvas");
        cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        const d=cv.toDataURL("image/jpeg",0.8);
        att={type:"image",media_type:"image/jpeg",data:d.split(",")[1],name:f.name||"image"};
        showChip();
      };
      im.onerror=()=>alert(t("readFail"));
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  }else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
    if(f.size>4*1024*1024){alert(t("tooBig"));return}
    rd.onload=()=>{att={type:"pdf",media_type:"application/pdf",data:String(rd.result).split(",")[1],name:f.name};showChip()};
    rd.readAsDataURL(f);
  }else{
    rd.onload=()=>{att={type:"text",text:String(rd.result).slice(0,20000),name:f.name};showChip()};
    rd.readAsText(f);
  }
}

    r.appendChild(s);r.appendChild(x);l.appendChild(r);
  });
}
$("menu").onclick=()=>{drawer();$("drawer").classList.add("open")};
$("dclose").onclick=()=>$("drawer").classList.remove("open");
$("dnew").onclick=()=>{DB.cur=null;cur();persist();render();$("drawer").classList.remove("open")};
function bind(id,key,chk){const e=$(id);if(chk)e.checked=S[key];else e.value=S[key];e.onchange=()=>{S[key]=chk?e.checked:e.value;saveS()}}
bind("theme","theme");bind("fs","fs");bind("rate","rate");bind("auto","auto",true);bind("search","search",true);bind("style","style");bind("quality","quality");bind("sl","sl");
function voices(){
  const v=$("voice");v.innerHTML="";
  const o=mk("option","",t("vdef"));o.value="";v.appendChild(o);
  if(window.speechSynthesis){speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().indexOf(S.sl.split("-")[0].toLowerCase())===0).forEach(x=>{const p=mk("option","",x.name);p.value=x.name;v.appendChild(p)})}
  v.value=S.voice;
}
$("sl").addEventListener("change",voices);
$("voice").onchange=e=>{S.voice=e.target.value;saveS()};
$("alang").onchange=e=>{
  S.lang=e.target.value;
  S.sl=SLMAP[S.lang]||"en-US";
  $("sl").value=S.sl;
  saveS();applyLang();ensureLang();voices();
};
$("ccountry").onchange=e=>{
  S.country=e.target.value;
  if(S.country){
    S.lang=langFor(S.country);
    S.sl=SLMAP[S.lang]||"en-US";
    $("alang").value=S.lang;
    $("sl").value=S.sl;
  }
  saveS();applyLang();ensureLang();voices();
};
$("gear").onclick=()=>{$("alang").value=S.lang;$("ccountry").value=S.country;voices();$("set").classList.add("open")};
$("sclose").onclick=()=>$("set").classList.remove("open");
$("exp").onclick=()=>{
  const tx=DB.chats.map(c=>(isNew(c)?t("newTitle"):c.title)+"\n"+c.msgs.map(m=>(m.role==="user"?t("me"):t("ai"))+": "+m.content).join("\n")).join("\n\n----\n\n");
  alert(copyText(tx)?t("expOk"):t("expFail"));
};
$("clr").onclick=()=>{if(confirm(t("clrQ"))){DB={cur:null,chats:[]};persist();render();$("set").classList.remove("open")}};
$("priv").onclick=()=>window.open("/privacy","_blank");
$("logout").onclick=()=>alert(t("loginMsg"));
$("delacc").onclick=()=>alert(t("loginMsg"));
$("prem").onclick=()=>$("pm").classList.add("open");
$("pclose").onclick=()=>$("pm").classList.remove("open");
$("buy").onclick=()=>alert(t("buyMsg"));
$("welL").onchange=e=>{S.lang=e.target.value;applyLang();ensureLang()};
$("welC").onchange=e=>{
  if(!e.target.value)return;
  S.lang=langFor(e.target.value);
  $("welL").value=S.lang;
  applyLang();ensureLang();
};
$("welGo").onclick=()=>{
  if(!$("welC").value){alert(t("need"));return}
  S.country=$("welC").value;
  S.lang=$("welL").value;
  S.sl=SLMAP[S.lang]||"en-US";
  S.onb=true;
  saveS();
  $("sl").value=S.sl;
  $("wel").classList.remove("open");
  applyLang();ensureLang();
};
saveS();
applyLang();
ensureLang();
$("welL").value=S.lang;
$("sl").value=S.sl;
if(!S.onb)$("wel").classList.add("open");
if(/\bwv\b/.test(navigator.userAgent)){$("mCam").style.display="none"}
</script>
</body>
</html>
